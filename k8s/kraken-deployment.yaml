apiVersion: v1
kind: Namespace
metadata:
  name: default

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kraken-bot-shadow
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kraken-bot
      variant: shadow
  template:
    metadata:
      labels:
        app: kraken-bot
        variant: shadow
    spec:
      containers:
      - name: kraken
        image: kraken-bot:v12
        imagePullPolicy: IfNotPresent
        env:
        - name: KRAKEN_MODE
          value: "shadow"
        - name: KRAKEN_API_KEY
          valueFrom:
            secretKeyRef:
              name: kraken-secrets
              key: api-key
      - name: watchdog
        image: kraken-watchdog:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: INSTANCE_TYPE
          value: "shadow"
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: telegram-secrets
              key: bot-token

