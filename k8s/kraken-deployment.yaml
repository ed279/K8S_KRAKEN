---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kraken-bot-live
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kraken-bot
      variant: live
  template:
    metadata:
      labels:
        app: kraken-bot
        variant: live
    spec:
      containers:
      - name: kraken
        image: kraken-bot:v12
        imagePullPolicy: IfNotPresent
        env:
        - name: KRAKEN_MODE
          value: "live"
        - name: KRAKEN_API_KEY
          valueFrom:
            secretKeyRef:
              name: kraken-secrets
              key: api-key
        - name: VAULT_ADDR
          value: "http://vault.default.svc:8200"
      - name: watchdog
        image: kraken-watchdog:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: INSTANCE_TYPE
          value: "live"
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: telegram-secrets
              key: bot-token
        - name: TELEGRAM_CHAT_ID
          value: "8746813544"
