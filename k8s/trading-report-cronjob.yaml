apiVersion: batch/v1
kind: CronJob
metadata:
  name: trading-report-hourly
  namespace: default
spec:
  # Run every hour on the hour
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: trading-reporter
          containers:
          - name: reporter
            image: kraken-trading-report:v1
            imagePullPolicy: IfNotPresent
            args: ["--once"]
            env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-trading-secret
                  key: bot_token
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: telegram-trading-secret
                  key: chat_id
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
          restartPolicy: OnFailure
          backoffLimit: 2
