apiVersion: v1
kind: ConfigMap
metadata:
  name: watchdog-config
  namespace: default
data:
  report_interval: "300"  # 5 minutes

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kraken-watchdog
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kraken-watchdog
  template:
    metadata:
      labels:
        app: kraken-watchdog
    spec:
      serviceAccountName: kraken-watchdog
      containers:
      - name: watchdog
        image: kraken-watchdog:v2-reporter
        imagePullPolicy: IfNotPresent
        env:
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: telegram-secrets
              key: bot-token
        - name: TELEGRAM_CHAT_ID
          value: "8746813544"
        - name: REPORT_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: watchdog-config
              key: report_interval
        - name: KRAKEN_NAMESPACE
          value: "default"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kraken-watchdog
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kraken-watchdog
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
  namespaceSelector:
    matchNames:
    - default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kraken-watchdog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kraken-watchdog
subjects:
- kind: ServiceAccount
  name: kraken-watchdog
  namespace: default
