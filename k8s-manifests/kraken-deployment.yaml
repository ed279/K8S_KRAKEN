---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kraken-bot-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kraken-bot-role
rules:
# Read pod identity (for logging)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get"]
# Access trading credentials
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
  resourceNames: ["kraken-trading-creds"]
# Read strategy config
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get"]
  resourceNames: ["kraken-config"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kraken-bot-rb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kraken-bot-role
subjects:
- kind: ServiceAccount
  name: kraken-bot-sa
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kraken-live
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kraken-bot
      variant: live
  template:
    metadata:
      labels:
        app: kraken-bot
        variant: live
    spec:
      serviceAccountName: kraken-bot-sa
      containers:
      - name: kraken-live
        image: localhost:5000/kraken-bot@sha256:abc123...
        env:
        - name: VARIANT
          value: "live"
        - name: KRAKEN_API_KEY
          valueFrom:
            secretKeyRef:
              name: kraken-trading-creds
              key: api-key
        - name: KRAKEN_API_SECRET
          valueFrom:
            secretKeyRef:
              name: kraken-trading-creds
              key: api-secret
        resources:
          requests: {cpu: 500m, memory: 512Mi}
          limits: {cpu: 2000m, memory: 1Gi}
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
